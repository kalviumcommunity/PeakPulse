services:
  # =========================================================================
  # 1. PostgreSQL Database Service
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: peakpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-peakpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peakpulse_secret}
      POSTGRES_DB: ${DB_NAME:-peakpulse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - peakpulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-peakpulse} -d ${DB_NAME:-peakpulse_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # 2. Express Backend API Service
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peakpulse-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-peakpulse}:${DB_PASSWORD:-peakpulse_secret}@postgres:5432/${DB_NAME:-peakpulse_db}
      JWT_SECRET: ${JWT_SECRET:-peakpulse_jwt_secret_key_production_32_chars}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8443}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - peakpulse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =========================================================================
  # 3. Nginx Frontend SPA Service
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peakpulse-frontend
    restart: unless-stopped
    ports:
      - "8443:8443"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - peakpulse-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# =========================================================================
# Networks & Persistent Volumes
# =========================================================================
networks:
  peakpulse-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
